name: CI

on:
  push:
    # Feature branches build too: the Android module cannot be compiled in every
    # development environment, so CI is often the first compiler to see it.
    branches: [main, master, 'claude/**', 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly live eval run, to catch prompt and model drift the replay job cannot see.
    - cron: "0 3 * * *"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Pytest
        run: pytest -q

      - name: Behavioural evals (replay)
        # Deterministic and free: every model call is served from a committed cassette,
        # so this runs on every PR without an API key. A cassette mismatch here means
        # the agent behaves differently than when the baseline was recorded.
        run: python -m evals.runner --replay

  evals-live:
    # The replay job above cannot see prompt or model drift, because it never calls the
    # model. This one does, nightly, against the real API.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Behavioural evals (live)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m evals.runner --live --reps 2
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: .claude/hillclimb/kodi-agent/baseline/
