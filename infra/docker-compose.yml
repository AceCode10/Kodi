# Kodi V1 — local/VPS stack
# Run from repo root: docker compose -f infra/docker-compose.yml up -d
# Copy backend/.env.example to backend/.env and fill in API keys before starting.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../backend/.env
    volumes:
      - backend_data:/app/data
    depends_on:
      - qdrant
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"

volumes:
  qdrant_data:
  backend_data:
